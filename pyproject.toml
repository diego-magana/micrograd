[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograd"
version = "0.1.0"
description = "A scalar-valued autograd engine with a minimal neural network library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# The engine and nn library are pure-stdlib (math, random) — no runtime deps.
dependencies = []

[project.optional-dependencies]
dev = ["torch", "numpy", "matplotlib", "pytest", "jupyter", "nbconvert", "graphviz"]

[tool.setuptools.packages.find]
include = ["micrograd*"]
